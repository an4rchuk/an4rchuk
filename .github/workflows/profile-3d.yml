name: Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-contrib-settings.json

      - name: Make the growing animation loop
        run: |
          python3 - <<'PY'
          import re
          p = "profile-3d-contrib/profile-customize.svg"
          s = open(p).read()
          pat = re.compile(r'values="([^";]+);([^";]+)" dur="3s" repeatCount="1"')
          s, n = pat.subn(lambda m: f'values="{m[1]};{m[2]};{m[2]}" keyTimes="0;0.3;1" dur="10s" repeatCount="indefinite"', s)
          open(p, "w").write(s)
          print("looped", n, "animations")
          PY

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update 3D contribution graph" || echo "No changes"
          git push
